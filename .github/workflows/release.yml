name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  dmg:
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, 'Release v')
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build an unsigned disk image
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          shopt -s nullglob
          files=(release/*/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No disk image was produced."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Unsigned macOS disk image. No Apple certificate is configured."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
